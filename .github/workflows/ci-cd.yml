name: Autonomous CI/CD Pipeline & Release

# Created by 11Hopem
# Copyright (c) 2026 11hopem. All rights reserved.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  quality-and-tests:
    name: Automated Testing & Quality Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install || true

      - name: Execute Full Automated Test Suite (Rule 8)
        run: npm test

  autonomous-release:
    name: Semantic Versioning & GitHub Release
    needs: quality-and-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Author (Rule 2)
        run: |
          git config user.name "Umut Öçgüder"
          git config user.email "umutocgdr@gmail.com"

      - name: Generate Release Tag
        id: tagger
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          COMMIT_MSG=$(git log -1 --pretty=%B)
          python3 -c '
import sys
tag = sys.argv[1].lstrip("v")
parts = [int(p) for p in tag.split(".")] if "." in tag else [1, 0, 0]
msg = sys.argv[2]
if "feat!" in msg or "BREAKING" in msg:
    parts[0] += 1; parts[1] = 0; parts[2] = 0
elif "feat" in msg:
    parts[1] += 1; parts[2] = 0
else:
    parts[2] += 1
new_tag = f"v{parts[0]}.{parts[1]}.{parts[2]}"
print(f"new_tag={new_tag}")
' "$LATEST_TAG" "$COMMIT_MSG" >> $GITHUB_OUTPUT

      - name: Tag and Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagger.outputs.new_tag }}
          name: "Release ${{ steps.tagger.outputs.new_tag }} - teams-bot"
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

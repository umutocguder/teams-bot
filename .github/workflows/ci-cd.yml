name: Autonomous CI/CD Pipeline & Release

# Created by 11Hopem
# Copyright (c) 2026 11Hopem. All rights reserved.

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality-and-tests:
    name: Automated Testing & Quality Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install || true

      - name: Execute Full Automated Test Suite (Rule 8)
        run: npm test

  autonomous-release:
    name: Semantic Versioning & GitHub Release
    needs: quality-and-tests
    # Tag ve Release yalniz elle tetiklenince basilir, her push'ta degil.
    # Dal modeli: master = prod; tag yalniz yayina cikmis surume atilir.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Git Author (Rule 2)
        run: |
          git config user.name "Umut Öçgüder"
          git config user.email "umutocgdr@gmail.com"

      - name: Determine Semantic Version Bump & Update
        id: versioning
        run: |
          LAST_COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Last commit message: $LAST_COMMIT_MSG"
          
          if [[ "$LAST_COMMIT_MSG" == *"feat!"* ]] || [[ "$LAST_COMMIT_MSG" == *"BREAKING"* ]]; then
            BUMP_TYPE="major"
          elif [[ "$LAST_COMMIT_MSG" == *"feat"* ]]; then
            BUMP_TYPE="minor"
          else
            BUMP_TYPE="patch"
          fi
          
          echo "Selected bump type: $BUMP_TYPE"
          npm version "$BUMP_TYPE" --no-git-tag-version
          
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit & Push Version Bump
        run: |
          git add package.json
          git commit -m "chore(release): bump version to ${{ steps.versioning.outputs.tag_name }}" || echo "No changes to commit"
          git tag ${{ steps.versioning.outputs.tag_name }}
          git push origin HEAD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate GitHub Release with Release Notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag_name }}
          name: "Release ${{ steps.versioning.outputs.tag_name }} - teams-bot"
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
